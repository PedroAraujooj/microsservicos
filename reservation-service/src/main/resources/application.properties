server.port=8082

spring.application.name=reservation-service

spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/reservationdb}
spring.datasource.username=${POSTGRES_USER:reservations}
spring.datasource.password=${POSTGRES_PASSWORD:reservations}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.instance-id=${spring.application.name}:${server.port}

spring.cloud.openfeign.client.config.default.connectTimeout=2000
spring.cloud.openfeign.client.config.default.readTimeout=2000

resilience4j.circuitbreaker.instances.eventCatalog.register-health-indicator=true
resilience4j.circuitbreaker.instances.eventCatalog.sliding-window-size=5
resilience4j.circuitbreaker.instances.eventCatalog.minimum-number-of-calls=2
resilience4j.circuitbreaker.instances.eventCatalog.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.eventCatalog.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.eventCatalog.permitted-number-of-calls-in-half-open-state=2

management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=health,info,circuitbreakers
